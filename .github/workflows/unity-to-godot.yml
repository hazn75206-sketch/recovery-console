name: Unity to Godot (Unidot headless)

on:
  workflow_dispatch:
    inputs:
      apk_base:
        description: "Nama file game (tanpa .part). Mode link: nama hasil download."
        default: "game.apk"
        required: false
        type: string
      game_url:
        description: "Link download langsung (opsional). Kalau diisi, runner download sendiri."
        required: false
        type: string
      inbox_branch:
        description: "Branch tempat pecahan file game"
        default: "unity-inbox"
        required: false
        type: string
      result_tag:
        description: "Tag release hasil"
        default: "unity-godot"
        required: false
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    name: Rip + Unidot headless (${{ inputs.apk_base }})
    steps:
      - name: Checkout repo (workflow + driver)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Ambil pecahan game dari inbox
        if: inputs.game_url == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.inbox_branch }}
          path: inbox
          fetch-depth: 1

      - name: Download dari link (mode tanpa upload)
        if: inputs.game_url != ''
        shell: bash
        run: |
          set -e
          URL='${{ inputs.game_url }}'
          GAME='${{ inputs.apk_base }}'
          if [[ "$URL" != https://* && "$URL" != http://* ]]; then
            echo "URL harus diawali http(s) dan langsung ke file (bukan halaman web/login)."
            exit 1
          fi
          if [ -z "$GAME" ]; then
            echo "apk_base wajib diisi untuk mode link (jadi nama file)."
            exit 1
          fi
          echo "Download langsung dari URL..."
          curl -L --fail --retry 2 --max-time 3600 -o "$GAME" "$URL"
          ls -lh "$GAME"

      - name: Sambung pecahan + validasi
        if: inputs.game_url == ''
        shell: bash
        run: |
          set -e
          GAME='${{ inputs.apk_base }}'
          PARTS=(inbox/"$GAME".part*)
          if [ ! -e "${PARTS[0]}" ]; then
            echo "BELUM ADA: pecahan $GAME.part* tidak ada di branch ${{ inputs.inbox_branch }}. Upload dulu, lalu dispatch ulang."
            exit 1
          fi
          cat inbox/"$GAME".part* > "$GAME"
          ls -lh "$GAME"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); n=z.namelist(); print('entries=%d bad=%s' % (len(n), z.testzip())); assert len(n) > 10 and z.testzip() is None" "$GAME"

      - name: Validasi file link + ekstrak XAPK
        if: inputs.game_url != ''
        shell: bash
        run: |
          set -e
          GAME='${{ inputs.apk_base }}'
          ls -lh "$GAME"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); n=z.namelist(); print('entries=%d bad=%s' % (len(n), z.testzip())); assert len(n) > 0 and z.testzip() is None" "$GAME"
          if [[ "$GAME" == *.xapk ]]; then
            echo "XAPK terdeteksi, ekstrak dulu (APK utama dipilih otomatis)."
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('xapk_in')" "$GAME"
          fi

      - name: Tentukan APK utama
        shell: bash
        run: |
          set -e
          GAME='${{ inputs.apk_base }}'
          SRC="$GAME"
          if [[ "$GAME" == *.xapk ]]; then
            SRC=$(python3 -c "import os; fs=[os.path.join('xapk_in',f) for f in os.listdir('xapk_in') if f.endswith('.apk')]; print(max(fs, key=os.path.getsize))")
          fi
          echo "APK utama: $SRC"
          cp "$SRC" main.apk
          ls -lh main.apk

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download AssetRipper 2.0.0
        shell: bash
        run: |
          set -e
          mkdir -p ar && cd ar
          curl -sSL -m 600 https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_linux_x64.tar.xz -o ar.tar.xz
          tar -xf ar.tar.xz
          chmod +x AssetRipper.GUI.Free

      - name: Rip game (AssetRipper headless + API)
        shell: bash
        run: |
          set -e
          cd ar
          (nohup ./AssetRipper.GUI.Free --headless --port 18089 > ar-web.log 2>&1 &)
          for i in $(seq 1 30); do
            grep -q "Now listening" ar-web.log && break
            sleep 5
          done
          grep -q "Now listening" ar-web.log
          curl -sS -m 1800 -X POST --data-urlencode "Path=$GITHUB_WORKSPACE/main.apk" http://127.0.0.1:18089/LoadFile -o /dev/null
          echo "Load terkirim, tunggu processing..."
          for i in $(seq 1 120); do
            grep -q "Finished processing assets" ar-web.log && break
            sleep 30
          done
          grep -q "Finished processing assets" ar-web.log
          mkdir -p "$GITHUB_WORKSPACE/unity_out"
          curl -sS -m 3600 -X POST --data-urlencode "Path=$GITHUB_WORKSPACE/unity_out" http://127.0.0.1:18089/Export/UnityProject -o /dev/null
          ls "$GITHUB_WORKSPACE/unity_out"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -e
          mkdir -p tools && cd tools
          curl -sSL -m 600 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o godot.zip
          python3 -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.')"
          chmod +x Godot_v4.3-stable_linux.x86_64
          ./Godot_v4.3-stable_linux.x86_64 --version

      - name: Rakit project kerja (Unidot + driver)
        shell: bash
        run: |
          set -e
          W="$GITHUB_WORKSPACE/work/game_godot"
          mkdir -p "$W/addons" "$W/unity_assets"
          cp -r main/tools/headless_unidot "$W/addons/"
          curl -sSL -m 300 https://github.com/V-Sekai/unidot_importer/archive/refs/heads/main.zip -o unidot.zip
          python3 -c "import zipfile; zipfile.ZipFile('unidot.zip').extractall('ud')"
          cp -r ud/unidot_importer-main "$W/addons/unidot_importer"
          cp -r "$GITHUB_WORKSPACE/unity_out/ExportedProject/." "$W/unity_assets/"
          cat > "$W/project.godot" <<'EOF'
          config_version=5

          [application]

          config/name="Unity to Godot"
          run/main_scene=""
          config/features=PackedStringArray("4.3", "GL Compatibility")

          [editor_plugins]

          enabled=PackedStringArray("headless_unidot")
          EOF
          find "$W/unity_assets" -name "*.meta" | wc -l
          find "$W/unity_assets" -name "*.prefab" | wc -l

      - name: Import headless (Unidot, full)
        shell: bash
        env:
          UNITY_SRC_DIR: ${{ github.workspace }}/work/game_godot/unity_assets
          UNIDOT_DONE: ${{ github.workspace }}/unidot_done.txt
        run: |
          set -e
          cd tools
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/work/game_godot" --quit-after 400000 > "$GITHUB_WORKSPACE/unidot.log" 2>&1 || true
          tail -n 30 "$GITHUB_WORKSPACE/unidot.log"
          cat "$GITHUB_WORKSPACE/unidot_done.txt"

      - name: Bungkus 2 output + Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG='${{ inputs.result_tag }}'
          BASE='${{ inputs.apk_base }}'
          BASE="${BASE%.*}"
          tar -czf "$BASE-godot.tar.gz" -C work game_godot
          tar -czf "$BASE-unity-source.tar.gz" unity_out
          ls -lh "$BASE-godot.tar.gz" "$BASE-unity-source.tar.gz"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" --title "Unity to Godot $TAG" --notes "Hasil convert Unity ke Godot (Unidot headless). Script C#/shader tidak ikut (batas tool)."
          gh release upload "$TAG" "$BASE-godot.tar.gz" "$BASE-unity-source.tar.gz"
          echo "RELEASE_OK https://github.com/${{ github.repository }}/releases/tag/$TAG"
