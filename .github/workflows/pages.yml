name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Suntik token dari secret repo
        run: |
          python3 - <<'EOF'
          t = open("index.html").read()
          assert "__RC_TOKEN__" in t, "placeholder hilang"
          open("index.html", "w").write(t.replace("__RC_TOKEN__", "${{ secrets.RC_TOKEN }}"))
          EOF
          grep -c "gho_" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
